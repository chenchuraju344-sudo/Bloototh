<!DOCTYPE html>
<html lang="te">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>లైవ్ బ్లూటూత్ మైక్ - Live Mic</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
    }
    body {
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: #1e293b;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      width: 100%;
      max-width: 400px;
      text-align: center;
    }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 10px;
      color: #38bdf8;
    }
    p {
      font-size: 0.9rem;
      color: #94a3b8;
      margin-bottom: 25px;
    }
    .mic-btn {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      border: none;
      background: #ef4444;
      color: white;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(239, 68, 68, 0.4);
      transition: all 0.3s ease;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0 auto 25px auto;
    }
    .mic-btn.active {
      background: #22c55e;
      box-shadow: 0 0 25px rgba(34, 197, 94, 0.7);
      transform: scale(1.05);
    }
    .slider-container {
      margin: 20px 0;
      text-align: left;
    }
    label {
      display: block;
      font-size: 0.85rem;
      margin-bottom: 8px;
      color: #cbd5e1;
    }
    input[type="range"] {
      width: 100%;
      accent-color: #38bdf8;
    }
    .status {
      margin-top: 15px;
      padding: 10px;
      border-radius: 8px;
      background: #334155;
      font-size: 0.85rem;
      color: #f1f5f9;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>లైవ్ మైక్ (Live Mic)</h1>
    <p>బ్లూటూత్ స్పీకర్ కనెక్ట్ చేసి బటన్ నొక్కండి</p>

    <button id="toggleBtn" class="mic-btn">మైక్ ఆన్</button>

    <div class="slider-container">
      <label for="gainSlider">వాల్యూమ్ బూస్ట్: <span id="gainValue">1x</span></label>
      <input type="range" id="gainSlider" min="0.5" max="3" step="0.1" value="1">
    </div>

    <div id="status" class="status">స్టేటస్: మైక్ ఆఫ్ చేయబడింది</div>
  </div>

  <script>
    let audioContext = null;
    let mediaStream = null;
    let sourceNode = null;
    let gainNode = null;
    let isRunning = false;

    const toggleBtn = document.getElementById('toggleBtn');
    const gainSlider = document.getElementById('gainSlider');
    const gainValue = document.getElementById('gainValue');
    const statusText = document.getElementById('status');

    gainSlider.addEventListener('input', (e) => {
      const val = e.target.value;
      gainValue.innerText = `${val}x`;
      if (gainNode) {
        gainNode.gain.setValueAtTime(parseFloat(val), audioContext.currentTime);
      }
    });

    async function startMic() {
      try {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        audioContext = new AudioContextClass({ latencyHint: 'interactive' });

        // బ్రౌజర్‌లో మైక్ ఇన్‌పుట్ తీసుకోవడం (ఎకో అండ్ నాయిస్ తగ్గించే ఫీచర్స్ తో)
        mediaStream = await navigator.mediaDevices.getUserMedia({
          audio: {
            echoCancellation: false, // లైవ్ ఆడియో డీలే తగ్గించడానికి
            noiseSuppression: true,
            autoGainControl: true,
            latency: 0
          }
        });

        sourceNode = audioContext.createMediaStreamSource(mediaStream);
        gainNode = audioContext.createGain();

        gainNode.gain.setValueAtTime(parseFloat(gainSlider.value), audioContext.currentTime);

        // మైక్ నుండి వచ్చిన ఆడియోను స్పీకర్ కి పంపడం
        sourceNode.connect(gainNode);
        gainNode.connect(audioContext.destination);

        if (audioContext.state === 'suspended') {
          await audioContext.resume();
        }

        isRunning = true;
        toggleBtn.innerText = "మైక్ ఆఫ్";
        toggleBtn.classList.add('active');
        statusText.innerText = "స్టేటస్: మైక్ లైవ్‌లో ఉంది 🔴";
      } catch (err) {
        console.error("Mic Access Error:", err);
        statusText.innerText = "ఎర్రర్: మైక్రోఫోన్ అనుమతి ఇవ్వండి";
      }
    }

    function stopMic() {
      if (mediaStream) {
        mediaStream.getTracks().forEach(track => track.stop());
      }
      if (sourceNode) {
        sourceNode.disconnect();
      }
      if (gainNode) {
        gainNode.disconnect();
      }
      if (audioContext) {
        audioContext.close();
      }

      isRunning = false;
      toggleBtn.innerText = "మైక్ ఆన్";
      toggleBtn.classList.remove('active');
      statusText.innerText = "స్టేటస్: మైక్ ఆఫ్ చేయబడింది";
    }

    toggleBtn.addEventListener('click', async () => {
      if (!isRunning) {
        await startMic();
      } else {
        stopMic();
      }
    });
  </script>
</body>
</html>
