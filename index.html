<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Mic to Bluetooth Box - 100% Fixed</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
   .card { background: #1e293b; padding: 30px; border-radius: 24px; box-shadow: 0 15px 35px rgba(0,0,0,0.6); width: 100%; max-width: 440px; text-align: center; }
    h1 { font-size: 1.6rem; margin-bottom: 6px; color: #38bdf8; font-weight: 700; }
    p { font-size: 0.85rem; color: #94a3b8; margin-bottom: 20px; }
   .device-select-container { margin-bottom: 15px; text-align: left; }
   .device-select-container label { display: block; font-size: 0.8rem; margin-bottom: 6px; color: #38bdf8; font-weight: 600; }
   .device-select { width: 100%; padding: 12px; border-radius: 10px; background: #0f172a; color: #f8fafc; border: 2px solid #38bdf8; font-size: 0.9rem; outline: none; cursor: pointer; }
   .visualizer-container { width: 100%; height: 60px; background: #0f172a; border-radius: 12px; margin-bottom: 20px; overflow: hidden; border: 1px solid #334155; }
    canvas { width: 100%; height: 100%; display: block; }
   .mic-btn { width: 120px; height: 120px; border-radius: 50%; border: none; background: #ef4444; color: white; font-size: 1.1rem; font-weight: bold; cursor: pointer; box-shadow: 0 0 20px rgba(239, 68, 68, 0.4); transition: all 0.3s; display: flex; justify-content: center; align-items: center; margin: 0 auto 20px auto; text-transform: uppercase; }
   .mic-btn.active { background: #22c55e; box-shadow: 0 0 30px rgba(34, 197, 94, 0.7); }
   .btn-group { display: flex; gap: 10px; margin-bottom: 20px; }
   .action-btn { flex: 1; padding: 10px; background: #334155; color: #f8fafc; border: 1px solid #475569; border-radius: 10px; font-size: 0.85rem; font-weight: 600; cursor: pointer; }
   .action-btn:disabled { opacity: 0.5; cursor: not-allowed; }
   .status { padding: 12px; border-radius: 10px; background: #334155; font-size: 0.85rem; color: #cbd5e1; font-weight: 500; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Live Mic Pro</h1>
    <p>Voice ONLY from Bluetooth Box</p>

    <div class="device-select-container">
      <label for="speakerSelect">🔊 Step 1: Nee Bluetooth Box ni Select Chey:</label>
      <select id="speakerSelect" class="device-select">
        <option value="default">Loading Devices...</option>
      </select>
    </div>

    <div class="visualizer-container"><canvas id="visualizer"></canvas></div>
    <button id="toggleBtn" class="mic-btn">Turn On</button>

    <div class="btn-group">
      <button id="muteBtn" class="action-btn" disabled>Mute</button>
      <button id="testBtn" class="action-btn">Test Box</button>
    </div>

    <div id="status" class="status">Status: Mic OFF. Mundhu Box select chey</div>
    <audio id="bluetoothAudioPlayer" playsinline autoplay style="display:none"></audio>
  </div>

  <script>
    let audioContext, mediaStream, sourceNode, gainNode, bassNode, clarityNode, highpassFilter, compressorNode, analyserNode;
    let isRunning = false, animationId = null;

    const toggleBtn = document.getElementById('toggleBtn');
    const muteBtn = document.getElementById('muteBtn');
    const testBtn = document.getElementById('testBtn');
    const speakerSelect = document.getElementById('speakerSelect');
    const statusText = document.getElementById('status');
    const canvas = document.getElementById('visualizer');
    const canvasCtx = canvas.getContext('2d');
    const audioPlayer = document.getElementById('bluetoothAudioPlayer');

    function resizeCanvas(){ canvas.width = canvas.parentElement.clientWidth; canvas.height = canvas.parentElement.clientHeight; }
    resizeCanvas();

    async function updateOutputDevices(){
      try{
        // Mic permission adigithe ne device labels vasthay
        const devices = await navigator.mediaDevices.enumerateDevices();
        const audioOutputs = devices.filter(d => d.kind === 'audiooutput');
        speakerSelect.innerHTML = '';
        audioOutputs.forEach((device, idx)=>{
          const opt = document.createElement('option');
          opt.value = device.deviceId;
          // default device ni kuda chupisthundi
          opt.text = device.label || (device.deviceId === 'default'? 'System Default (Phone Speaker)' : `Speaker ${idx+1}`);
          if(device.label.toLowerCase().includes('bluetooth') || device.label.toLowerCase().includes('speaker') || device.label.toLowerCase().includes('boat') || device.label.toLowerCase().includes('jbl')){
            opt.text = "🔵 " + opt.text + " [SELECT THIS]";
          }
          speakerSelect.appendChild(opt);
        });
        if(audioOutputs.length === 0){
          speakerSelect.innerHTML = '<option value="default">No Bluetooth Box Found - Phone Settings lo connect chey</option>';
        }
      }catch(e){ console.log(e); }
    }

    // Test button - Box lo sound vasthunda leda check chesukodaniki
    testBtn.addEventListener('click', async ()=>{
      try{
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        if(typeof ctx.setSinkId === 'function' && speakerSelect.value!== 'default'){
          await ctx.setSinkId(speakerSelect.value);
        }
        const osc = ctx.createOscillator();
        osc.frequency.value = 440;
        osc.connect(ctx.destination);
        osc.start();
        setTimeout(()=>{ osc.stop(); ctx.close(); }, 500);
        statusText.innerText = "Test Tone... Box lo vinipisthe OK ✅";
        if(typeof audioPlayer.setSinkId === 'function' && speakerSelect.value){
          await audioPlayer.setSinkId(speakerSelect.value).catch(()=>{});
        }
      }catch(e){
        alert("Box select chey bro: " + e.message);
      }
    });

    speakerSelect.addEventListener('change', async ()=>{
      const id = speakerSelect.value;
      if(typeof audioPlayer.setSinkId === 'function'){
        try{ await audioPlayer.setSinkId(id); statusText.innerText = "Box Selected: " + speakerSelect.options[speakerSelect.selectedIndex].text; }catch(e){}
      }
      if(audioContext && typeof audioContext.setSinkId === 'function'){
        try{ await audioContext.setSinkId(id); }catch(e){}
      }
    });

    function drawVisualizer(){
      if(!analyserNode ||!isRunning) return;
      animationId = requestAnimationFrame(drawVisualizer);
      const bufferLength = analyserNode.frequencyBinCount;
      const dataArray = new Uint8Array(bufferLength);
      analyserNode.getByteFrequencyData(dataArray);
      canvasCtx.fillStyle = '#0f172a';
      canvasCtx.fillRect(0,0,canvas.width,canvas.height);
      const barWidth = (canvas.width / bufferLength) * 2.5;
      let x=0;
      for(let i=0;i<bufferLength;i++){
        const barHeight = (dataArray[i]/255)*canvas.height;
        canvasCtx.fillStyle = '#38bdf8';
        canvasCtx.fillRect(x, canvas.height-barHeight, barWidth, barHeight);
        x+=barWidth+1;
      }
    }

    async function startMic(){
      try{
        const AC = window.AudioContext || window.webkitAudioContext;
        audioContext = new AC({ latencyHint: 'interactive', sampleRate: 48000 });

        // FIX: Force output to selected Bluetooth device
        if(typeof audioContext.setSinkId === 'function' && speakerSelect.value && speakerSelect.value!== 'default'){
          try{ await audioContext.setSinkId(speakerSelect.value); }catch(e){ console.log("AudioContext setSinkId failed", e); }
        }

        mediaStream = await navigator.mediaDevices.getUserMedia({
          audio: {
            echoCancellation: true,
            noiseSuppression: true,
            autoGainControl: false,
            channelCount: 1
          }
        });

        await updateOutputDevices();

        sourceNode = audioContext.createMediaStreamSource(mediaStream);
        highpassFilter = audioContext.createBiquadFilter(); highpassFilter.type='highpass'; highpassFilter.frequency.value=85;
        bassNode = audioContext.createBiquadFilter(); bassNode.type='lowshelf'; bassNode.frequency.value=250; bassNode.gain.value=2;
        clarityNode = audioContext.createBiquadFilter(); clarityNode.type='highshelf'; clarityNode.frequency.value=3000; clarityNode.gain.value=5;
        compressorNode = audioContext.createDynamicsCompressor(); compressorNode.threshold.value=-20; compressorNode.ratio.value=10;
        gainNode = audioContext.createGain(); gainNode.gain.value=1.0;
        analyserNode = audioContext.createAnalyser(); analyserNode.fftSize=256;

        // FINAL CORRECT CHAIN -> Goes to Bluetooth Box ONLY
        sourceNode.connect(highpassFilter);
        highpassFilter.connect(bassNode);
        bassNode.connect(clarityNode);
        clarityNode.connect(compressorNode);
        compressorNode.connect(gainNode);

        // 1. Connect to Visualizer
        gainNode.connect(analyserNode);
        // 2. Connect to MAIN OUTPUT (which is now Bluetooth Box because of setSinkId)
        gainNode.connect(audioContext.destination);

        // 3. Also connect via <audio> element for extra force routing (Android Chrome fix)
        const dest = audioContext.createMediaStreamDestination();
        gainNode.connect(dest);
        audioPlayer.srcObject = dest.stream;
        if(typeof audioPlayer.setSinkId === 'function' && speakerSelect.value){
          await audioPlayer.setSinkId(speakerSelect.value).catch(()=>{});
        }
        await audioPlayer.play().catch(()=>{});

        if(audioContext.state === 'suspended') await audioContext.resume();

        isRunning=true;
        toggleBtn.innerText="Turn Off"; toggleBtn.classList.add('active');
        muteBtn.disabled=false;
        statusText.innerText="LIVE 🔴 Box lone vasthondi - Phone dooram pettu";
        drawVisualizer();

      }catch(err){
        statusText.innerText="Error: Mic permission ivvu";
        alert(err.message);
      }
    }

    function stopMic(){
      if(animationId) cancelAnimationFrame(animationId);
      if(mediaStream) mediaStream.getTracks().forEach(t=>t.stop());
      if(audioContext) audioContext.close();
      audioPlayer.pause(); audioPlayer.srcObject=null;
      isRunning=false;
      toggleBtn.innerText="Turn On"; toggleBtn.classList.remove('active');
      statusText.innerText="OFF";
      canvasCtx.clearRect(0,0,canvas.width,canvas.height);
    }

    toggleBtn.addEventListener('click', async()=>{ if(!isRunning) await startMic(); else stopMic(); });

    muteBtn.addEventListener('click', ()=>{
      if(!gainNode) return;
      if(gainNode.gain.value > 0){ gainNode.gain.value=0; muteBtn.innerText="Unmute"; }
      else{ gainNode.gain.value=1.0; muteBtn.innerText="Mute"; }
    });

    // Load devices on start
    navigator.mediaDevices.getUserMedia({audio:true}).then(s=>{
      s.getTracks().forEach(t=>t.stop());
      updateOutputDevices();
    }).catch(()=> updateOutputDevices());

    if(navigator.mediaDevices) navigator.mediaDevices.ondevicechange = updateOutputDevices;
  </script>
</body>
</html>
