<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Bluetooth Mic & Audio Console</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }
    body {
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: #1e293b;
      padding: 30px;
      border-radius: 24px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.6);
      width: 100%;
      max-width: 440px;
      text-align: center;
    }
    h1 {
      font-size: 1.6rem;
      margin-bottom: 6px;
      color: #38bdf8;
      font-weight: 700;
    }
    p {
      font-size: 0.85rem;
      color: #94a3b8;
      margin-bottom: 20px;
    }
    
    /* Visualizer Canvas */
    .visualizer-container {
      width: 100%;
      height: 60px;
      background: #0f172a;
      border-radius: 12px;
      margin-bottom: 20px;
      overflow: hidden;
      border: 1px solid #334155;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Main Action Button */
    .mic-btn {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      border: none;
      background: #ef4444;
      color: white;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(239, 68, 68, 0.4);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0 auto 20px auto;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .mic-btn.active {
      background: #22c55e;
      box-shadow: 0 0 30px rgba(34, 197, 94, 0.7);
      transform: scale(1.05);
    }

    /* Action Controls */
    .btn-group {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    .action-btn {
      flex: 1;
      padding: 10px;
      background: #334155;
      color: #f8fafc;
      border: 1px solid #475569;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .action-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .action-btn.active-rec {
      background: #dc2626;
      border-color: #ef4444;
      animation: pulse 1.5s infinite;
    }
    .action-btn.muted {
      background: #eab308;
      color: #0f172a;
      border-color: #facc15;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0.6); }
      70% { box-shadow: 0 0 0 10px rgba(220, 38, 38, 0); }
      100% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0); }
    }

    /* Sliders */
    .controls-panel {
      background: #0f172a;
      padding: 15px;
      border-radius: 14px;
      border: 1px solid #334155;
      margin-bottom: 15px;
    }
    .slider-container {
      margin-bottom: 12px;
      text-align: left;
    }
    .slider-container:last-child {
      margin-bottom: 0;
    }
    .slider-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      margin-bottom: 6px;
      color: #cbd5e1;
    }
    input[type="range"] {
      width: 100%;
      accent-color: #38bdf8;
      cursor: pointer;
    }

    /* Output Device Picker (NEW) */
    .output-panel {
      background: #0f172a;
      padding: 12px 15px;
      border-radius: 14px;
      border: 1px solid #334155;
      margin-bottom: 15px;
      text-align: left;
    }
    .output-panel label {
      display: block;
      font-size: 0.75rem;
      color: #94a3b8;
      margin-bottom: 8px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }
    .output-row {
      display: flex;
      gap: 8px;
    }
    select#outputSelect {
      flex: 1;
      background: #1e293b;
      color: #f8fafc;
      border: 1px solid #475569;
      border-radius: 8px;
      padding: 9px 10px;
      font-size: 0.82rem;
      cursor: pointer;
    }
    select#outputSelect:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .refresh-btn {
      background: #334155;
      color: #f8fafc;
      border: 1px solid #475569;
      border-radius: 8px;
      padding: 0 12px;
      font-size: 0.9rem;
      cursor: pointer;
    }
    .refresh-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .output-note {
      margin-top: 8px;
      font-size: 0.72rem;
      color: #64748b;
      line-height: 1.4;
    }

    /* Status Bar */
    .status {
      padding: 10px;
      border-radius: 10px;
      background: #334155;
      font-size: 0.85rem;
      color: #cbd5e1;
      font-weight: 500;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Live Mic Pro</h1>
    <p>Connect Bluetooth Speaker & Turn on Mic</p>

    <div class="visualizer-container">
      <canvas id="visualizer"></canvas>
    </div>

    <button id="toggleBtn" class="mic-btn">Turn On</button>

    <div class="btn-group">
      <button id="muteBtn" class="action-btn" disabled>Mute Mic</button>
      <button id="recBtn" class="action-btn" disabled>Record</button>
    </div>

    <!-- NEW: Output Device Picker — forces playback to the chosen speaker -->
    <div class="output-panel">
      <label for="outputSelect">Play Sound Through</label>
      <div class="output-row">
        <select id="outputSelect" disabled>
          <option value="">Turn mic on to list speakers…</option>
        </select>
        <button id="refreshOutputsBtn" class="refresh-btn" disabled title="Refresh device list">⟳</button>
      </div>
      <div class="output-note" id="outputNote"></div>
    </div>

    <div class="controls-panel">
      <div class="slider-container">
        <div class="slider-header">
          <label for="gainSlider">Volume Boost</label>
          <span id="gainValue">1.0x</span>
        </div>
        <input type="range" id="gainSlider" min="0.5" max="4" step="0.1" value="1">
      </div>

      <div class="slider-container">
        <div class="slider-header">
          <label for="bassSlider">Bass Boost (Low End)</label>
          <span id="bassValue">0 dB</span>
        </div>
        <input type="range" id="bassSlider" min="0" max="15" step="1" value="0">
      </div>

      <div class="slider-container">
        <div class="slider-header">
          <label for="claritySlider">Vocal Clarity (High End)</label>
          <span id="clarityValue">0 dB</span>
        </div>
        <input type="range" id="claritySlider" min="0" max="15" step="1" value="0">
      </div>
    </div>

    <div id="status" class="status">Status: Microphone is OFF</div>
  </div>

  <!-- NEW: hidden audio element — the actual output bridge. WebAudio's
       processed signal is piped into this element instead of straight to
       audioContext.destination, so we can force it onto a specific output
       device (the Bluetooth soundbox) with setSinkId(). -->
  <audio id="outputAudioEl" autoplay playsinline style="display:none"></audio>

  <script>
    let audioContext = null;
    let mediaStream = null;
    let sourceNode = null;
    let gainNode = null;
    let bassNode = null;
    let clarityNode = null;
    let analyserNode = null;
    let isRunning = false;
    let isMuted = false;

    // Low-cut filter removes handling-noise/rumble; limiter stops the
    // acoustic mic-to-speaker loop from building into repeated/echoed audio.
    let lowCutNode = null;
    let limiterNode = null;

    // NEW: MediaStreamDestination — turns the processed WebAudio graph back
    // into a MediaStream so it can be attached to <audio id="outputAudioEl">
    // and routed with setSinkId().
    let mediaStreamDest = null;

    // Recording Variables
    let mediaRecorder = null;
    let recordedChunks = [];
    let isRecording = false;

    // Animation Frame ID
    let animationId = null;

    // DOM Elements
    const toggleBtn = document.getElementById('toggleBtn');
    const muteBtn = document.getElementById('muteBtn');
    const recBtn = document.getElementById('recBtn');
    const gainSlider = document.getElementById('gainSlider');
    const gainValue = document.getElementById('gainValue');
    const bassSlider = document.getElementById('bassSlider');
    const bassValue = document.getElementById('bassValue');
    const claritySlider = document.getElementById('claritySlider');
    const clarityValue = document.getElementById('clarityValue');
    const statusText = document.getElementById('status');
    const canvas = document.getElementById('visualizer');
    const canvasCtx = canvas.getContext('2d');

    // NEW: output device picker elements
    const outputSelect = document.getElementById('outputSelect');
    const refreshOutputsBtn = document.getElementById('refreshOutputsBtn');
    const outputNote = document.getElementById('outputNote');
    const outputAudioEl = document.getElementById('outputAudioEl');
    const sinkIdSupported = typeof outputAudioEl.setSinkId === 'function';

    // Resize canvas to match render dimensions
    function resizeCanvas() {
      canvas.width = canvas.parentElement.clientWidth;
      canvas.height = canvas.parentElement.clientHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    // Visualizer Routine
    function drawVisualizer() {
      if (!analyserNode || !isRunning) {
        canvasCtx.clearRect(0, 0, canvas.width, canvas.height);
        return;
      }

      animationId = requestAnimationFrame(drawVisualizer);

      const bufferLength = analyserNode.frequencyBinCount;
      const dataArray = new Uint8Array(bufferLength);
      analyserNode.getByteFrequencyData(dataArray);

      canvasCtx.fillStyle = '#0f172a';
      canvasCtx.fillRect(0, 0, canvas.width, canvas.height);

      const barWidth = (canvas.width / bufferLength) * 2.5;
      let barHeight;
      let x = 0;

      for (let i = 0; i < bufferLength; i++) {
        barHeight = (dataArray[i] / 255) * canvas.height;

        canvasCtx.fillStyle = `rgb(56, 189, 248)`;
        canvasCtx.fillRect(x, canvas.height - barHeight, barWidth, barHeight);

        x += barWidth + 1;
      }
    }

    // Sliders Event Handlers
    gainSlider.addEventListener('input', (e) => {
      const val = parseFloat(e.target.value);
      gainValue.innerText = `${val.toFixed(1)}x`;
      if (gainNode && !isMuted) {
        gainNode.gain.setValueAtTime(val, audioContext.currentTime);
      }
    });

    bassSlider.addEventListener('input', (e) => {
      const val = parseFloat(e.target.value);
      bassValue.innerText = `+${val} dB`;
      if (bassNode) {
        bassNode.gain.setValueAtTime(val, audioContext.currentTime);
      }
    });

    claritySlider.addEventListener('input', (e) => {
      const val = parseFloat(e.target.value);
      clarityValue.innerText = `+${val} dB`;
      if (clarityNode) {
        clarityNode.gain.setValueAtTime(val, audioContext.currentTime);
      }
    });

    // ---------------------------------------------------------------------
    // NEW: Output device handling
    // ---------------------------------------------------------------------

    async function populateOutputDevices() {
      if (!navigator.mediaDevices || !navigator.mediaDevices.enumerateDevices) {
        outputNote.innerText = 'This browser cannot list output devices.';
        return;
      }
      try {
        const devices = await navigator.mediaDevices.enumerateDevices();
        const outputs = devices.filter((d) => d.kind === 'audiooutput');

        outputSelect.innerHTML = '';
        if (outputs.length === 0) {
          const opt = document.createElement('option');
          opt.value = '';
          opt.textContent = 'No output devices found';
          outputSelect.appendChild(opt);
          return;
        }

        outputs.forEach((d, i) => {
          const opt = document.createElement('option');
          opt.value = d.deviceId;
          opt.textContent = d.label || `Speaker ${i + 1}`;
          outputSelect.appendChild(opt);
        });

        // Try to auto-pick a device that looks like a Bluetooth speaker
        const btGuess = outputs.find((d) => /bluetooth|jbl|boat|soundbox|speaker/i.test(d.label));
        if (btGuess) {
          outputSelect.value = btGuess.deviceId;
          await applyOutputDevice(btGuess.deviceId);
        } else {
          await applyOutputDevice(outputSelect.value);
        }

        outputSelect.disabled = !sinkIdSupported;
        refreshOutputsBtn.disabled = !sinkIdSupported;

        if (!sinkIdSupported) {
          outputNote.innerText =
            'Your browser can\'t switch output device from the page. Set the Bluetooth soundbox as the SYSTEM default speaker before pressing Turn On.';
        } else {
          outputNote.innerText = 'Pick your Bluetooth soundbox here if sound is coming from the phone instead.';
        }
      } catch (err) {
        console.error('enumerateDevices error:', err);
        outputNote.innerText = 'Could not list output devices.';
      }
    }

    async function applyOutputDevice(deviceId) {
      if (!sinkIdSupported) return;
      try {
        await outputAudioEl.setSinkId(deviceId || '');
        statusText.innerText = 'Status: Output routed to selected speaker 🔊';
      } catch (err) {
        console.error('setSinkId error:', err);
        outputNote.innerText = 'Could not switch to that device. Try selecting it again.';
      }
    }

    outputSelect.addEventListener('change', (e) => applyOutputDevice(e.target.value));
    refreshOutputsBtn.addEventListener('click', () => populateOutputDevices());

    // Start Microphone Engine
    async function startMic() {
      try {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        audioContext = new AudioContextClass({ latencyHint: 'interactive' });

        mediaStream = await navigator.mediaDevices.getUserMedia({
          audio: {
            echoCancellation: true,
            noiseSuppression: true,
            autoGainControl: true,
            latency: 0
          }
        });

        sourceNode = audioContext.createMediaStreamSource(mediaStream);
        gainNode = audioContext.createGain();

        // Low-cut (high-pass) filter — removes sub-100Hz handling noise/rumble
        lowCutNode = audioContext.createBiquadFilter();
        lowCutNode.type = 'highpass';
        lowCutNode.frequency.value = 90;
        lowCutNode.Q.value = 0.707;

        // Bass Filter Setup (Low-Shelf)
        bassNode = audioContext.createBiquadFilter();
        bassNode.type = 'lowshelf';
        bassNode.frequency.value = 250;
        bassNode.gain.value = parseFloat(bassSlider.value);

        // Vocal Clarity Filter Setup (High-Shelf)
        clarityNode = audioContext.createBiquadFilter();
        clarityNode.type = 'highshelf';
        clarityNode.frequency.value = 3000;
        clarityNode.gain.value = parseFloat(claritySlider.value);

        // Limiter (DynamicsCompressor) — clamps any feedback build-up
        limiterNode = audioContext.createDynamicsCompressor();
        limiterNode.threshold.setValueAtTime(-18, audioContext.currentTime);
        limiterNode.knee.setValueAtTime(6, audioContext.currentTime);
        limiterNode.ratio.setValueAtTime(16, audioContext.currentTime);
        limiterNode.attack.setValueAtTime(0.002, audioContext.currentTime);
        limiterNode.release.setValueAtTime(0.15, audioContext.currentTime);

        // Visualizer Setup
        analyserNode = audioContext.createAnalyser();
        analyserNode.fftSize = 64;

        // NEW: MediaStreamDestination — bridges WebAudio back to a real
        // <audio> element so we can pick its output device explicitly.
        mediaStreamDest = audioContext.createMediaStreamDestination();

        // Apply Initial Gain
        gainNode.gain.setValueAtTime(parseFloat(gainSlider.value), audioContext.currentTime);

        // Audio Chain: Source -> LowCut -> Bass -> Clarity -> Gain -> Limiter -> Analyser
        //                                                              \-> MediaStreamDest -> <audio> -> chosen speaker
        sourceNode.connect(lowCutNode);
        lowCutNode.connect(bassNode);
        bassNode.connect(clarityNode);
        clarityNode.connect(gainNode);
        gainNode.connect(limiterNode);
        limiterNode.connect(analyserNode);
        limiterNode.connect(mediaStreamDest);

        // NOTE: we deliberately do NOT also connect limiterNode straight to
        // audioContext.destination anymore — all sound now leaves through
        // outputAudioEl so the sink (speaker) selection actually controls
        // where it plays. Connecting both would double the audio.
        outputAudioEl.srcObject = mediaStreamDest.stream;
        try {
          await outputAudioEl.play();
        } catch (playErr) {
          console.warn('Autoplay blocked, will retry on next tap:', playErr);
          const retryOnce = () => {
            outputAudioEl.play().catch(() => {});
            document.removeEventListener('click', retryOnce);
          };
          document.addEventListener('click', retryOnce);
        }

        if (audioContext.state === 'suspended') {
          await audioContext.resume();
        }

        isRunning = true;
        isMuted = false;
        
        // UI Updates
        toggleBtn.innerText = "Turn Off";
        toggleBtn.classList.add('active');
        muteBtn.disabled = false;
        recBtn.disabled = false;
        muteBtn.innerText = "Mute Mic";
        muteBtn.classList.remove('muted');
        statusText.innerText = "Status: Microphone is LIVE 🔴";

        // NEW: now that mic permission is granted, device labels are
        // visible — populate & apply the speaker picker.
        await populateOutputDevices();

        drawVisualizer();
      } catch (err) {
        console.error("Mic Access Error:", err);
        statusText.innerText = "Error: Please allow microphone access";
      }
    }

    // Stop Microphone Engine
    function stopMic() {
      if (isRecording) {
        stopRecording();
      }

      if (animationId) {
        cancelAnimationFrame(animationId);
      }

      if (mediaStream) {
        mediaStream.getTracks().forEach(track => track.stop());
      }
      if (sourceNode) sourceNode.disconnect();
      if (lowCutNode) lowCutNode.disconnect();
      if (bassNode) bassNode.disconnect();
      if (clarityNode) clarityNode.disconnect();
      if (gainNode) gainNode.disconnect();
      if (limiterNode) limiterNode.disconnect();
      if (analyserNode) analyserNode.disconnect();
      if (mediaStreamDest) mediaStreamDest.disconnect();
      if (audioContext) audioContext.close();

      // NEW: detach the output element cleanly
      outputAudioEl.pause();
      outputAudioEl.srcObject = null;
      outputSelect.disabled = true;
      refreshOutputsBtn.disabled = true;

      isRunning = false;
      isMuted = false;

      // UI Reset
      toggleBtn.innerText = "Turn On";
      toggleBtn.classList.remove('active');
      muteBtn.disabled = true;
      recBtn.disabled = true;
      muteBtn.innerText = "Mute Mic";
      muteBtn.classList.remove('muted');
      statusText.innerText = "Status: Microphone is OFF";

      // Clear Visualizer
      canvasCtx.clearRect(0, 0, canvas.width, canvas.height);
    }

    // Toggle Mic Button
    toggleBtn.addEventListener('click', async () => {
      if (!isRunning) {
        await startMic();
      } else {
        stopMic();
      }
    });

    // Quick Mute Feature
    muteBtn.addEventListener('click', () => {
      if (!isRunning || !gainNode) return;

      if (!isMuted) {
        gainNode.gain.setValueAtTime(0, audioContext.currentTime);
        muteBtn.innerText = "Unmute";
        muteBtn.classList.add('muted');
        statusText.innerText = "Status: Microphone MUTED 🔇";
        isMuted = true;
      } else {
        gainNode.gain.setValueAtTime(parseFloat(gainSlider.value), audioContext.currentTime);
        muteBtn.innerText = "Mute Mic";
        muteBtn.classList.remove('muted');
        statusText.innerText = "Status: Microphone is LIVE 🔴";
        isMuted = false;
      }
    });

    // Live Recording Feature
    recBtn.addEventListener('click', () => {
      if (!isRecording) {
        startRecording();
      } else {
        stopRecording();
      }
    });

    function startRecording() {
      recordedChunks = [];
      mediaRecorder = new MediaRecorder(mediaStream);

      mediaRecorder.ondataavailable = (e) => {
        if (e.data.size > 0) {
          recordedChunks.push(e.data);
        }
      };

      mediaRecorder.onstop = () => {
        const blob = new Blob(recordedChunks, { type: 'audio/webm' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.style.display = 'none';
        a.href = url;
        a.download = `mic-recording-${Date.now()}.webm`;
        document.body.appendChild(a);
        a.click();
        setTimeout(() => {
          document.body.removeChild(a);
          window.URL.revokeObjectURL(url);
        }, 100);
      };

      mediaRecorder.start();
      isRecording = true;
      recBtn.innerText = "Stop Rec";
      recBtn.classList.add('active-rec');
      statusText.innerText = "Status: Recording Audio... ⏺️";
    }

    function stopRecording() {
      if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        mediaRecorder.stop();
      }
      isRecording = false;
      recBtn.innerText = "Record";
      recBtn.classList.remove('active-rec');
      if (isRunning) {
        statusText.innerText = isMuted ? "Status: Microphone MUTED 🔇" : "Status: Microphone is LIVE 🔴";
      }
    }
  </script>
</body>
</html>
