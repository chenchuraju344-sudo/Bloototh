<!DOCTYPE html>
<html lang="te">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>లైవ్ బ్లూటూత్ మెగాఫోన్</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    .card { background: #1e293b; padding: 30px 20px; border-radius: 24px; width: 100%; max-width: 400px; text-align: center; border: 1px solid #334155; }
    h1 { font-size: 1.4rem; color: #38bdf8; margin-bottom: 8px; }
    p { font-size: 0.85rem; color: #94a3b8; margin-bottom: 20px; }
    .mic-btn { width: 120px; height: 120px; border-radius: 50%; border: none; background: #ef4444; color: white; font-size: 1.1rem; font-weight: bold; cursor: pointer; margin: 0 auto 20px auto; display: block; box-shadow: 0 0 20px rgba(239, 68, 68, 0.4); }
    .mic-btn.active { background: #22c55e; box-shadow: 0 0 30px rgba(34, 197, 94, 0.7); }
    .select-box { margin-bottom: 15px; text-align: left; background: #0f172a; padding: 10px; border-radius: 10px; border: 1px solid #334155; }
    label { font-size: 0.8rem; color: #cbd5e1; display: block; margin-bottom: 6px; }
    select, input[type="range"] { width: 100%; background: #1e293b; color: white; border: 1px solid #475569; padding: 8px; border-radius: 6px; outline: none; }
    .status { margin-top: 15px; padding: 10px; border-radius: 8px; background: #334155; font-size: 0.85rem; }
  </style>
</head>
<body>

  <div class="card">
    <h1>బ్లూటూత్ లైవ్ స్పీకర్</h1>
    <p>బ్లూటూత్ బాక్స్ కనెక్ట్ చేసి మాట్లాడండి</p>

    <!-- బ్లూటూత్ మీడియా రూటింగ్ కోసం హిడెన్ ఆడియో ప్లేయర్ -->
    <audio id="liveAudio" autoplay playsinline></audio>

    <button id="toggleBtn" class="mic-btn">మైక్ ఆన్</button>

    <div class="select-box" id="deviceBox" style="display: none;">
      <label for="audioOutput">ఆడియో స్పీకర్ ఎంచుకోండి:</label>
      <select id="audioOutput"></select>
    </div>

    <div class="select-box">
      <label for="gainSlider">వాల్యూమ్ బూస్ట్: <span id="gainValue" style="color: #38bdf8;">1.5x</span></label>
      <input type="range" id="gainSlider" min="0.5" max="3.5" step="0.1" value="1.5">
    </div>

    <div id="status" class="status">స్టేటస్: సిద్ధంగా ఉంది</div>
  </div>

  <script>
    let audioContext = null;
    let mediaStream = null;
    let sourceNode = null;
    let gainNode = null;
    let audioDestinationNode = null;
    let wakeLock = null;
    let isRunning = false;

    const toggleBtn = document.getElementById('toggleBtn');
    const audioElement = document.getElementById('liveAudio');
    const audioOutputSelect = document.getElementById('audioOutput');
    const deviceBox = document.getElementById('deviceBox');
    const gainSlider = document.getElementById('gainSlider');
    const gainValue = document.getElementById('gainValue');
    const statusText = document.getElementById('status');

    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator) {
          wakeLock = await navigator.wakeLock.request('screen');
        }
      } catch (e) {}
    }

    function releaseWakeLock() {
      if (wakeLock) {
        wakeLock.release().catch(() => {});
        wakeLock = null;
      }
    }

    async function populateOutputDevices() {
      if (typeof audioElement.setSinkId !== 'undefined') {
        const devices = await navigator.mediaDevices.enumerateDevices();
        const audioOutputs = devices.filter(d => d.kind === 'audiooutput');
        
        if (audioOutputs.length > 0) {
          audioOutputSelect.innerHTML = '';
          audioOutputs.forEach(device => {
            const option = document.createElement('option');
            option.value = device.deviceId;
            option.text = device.label || `Speaker ${audioOutputSelect.length + 1}`;
            audioOutputSelect.appendChild(option);
          });
          deviceBox.style.display = 'block';
        }
      }
    }

    audioOutputSelect.addEventListener('change', async () => {
      if (typeof audioElement.setSinkId !== 'undefined') {
        try {
          await audioElement.setSinkId(audioOutputSelect.value);
        } catch (err) {
          console.error('Sink ID Error:', err);
        }
      }
    });

    gainSlider.addEventListener('input', (e) => {
      const val = parseFloat(e.target.value).toFixed(1);
      gainValue.innerText = `${val}x`;
      if (gainNode && audioContext) {
        gainNode.gain.setValueAtTime(parseFloat(val), audioContext.currentTime);
      }
    });

    async function startMic() {
      try {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        audioContext = new AudioContextClass({ latencyHint: 'interactive' });

        mediaStream = await navigator.mediaDevices.getUserMedia({
          audio: {
            echoCancellation: true,
            noiseSuppression: true,
            autoGainControl: true
          }
        });

        sourceNode = audioContext.createMediaStreamSource(mediaStream);

        // నాయిస్ & విజిల్ ఫిల్టర్లు
        const highPass = audioContext.createBiquadFilter();
        highPass.type = 'highpass';
        highPass.frequency.setValueAtTime(90, audioContext.currentTime);

        const voiceClarity = audioContext.createBiquadFilter();
        voiceClarity.type = 'peaking';
        voiceClarity.frequency.setValueAtTime(2400, audioContext.currentTime);
        voiceClarity.gain.setValueAtTime(4.0, audioContext.currentTime);

        const lowPass = audioContext.createBiquadFilter();
        lowPass.type = 'lowpass';
        lowPass.frequency.setValueAtTime(7000, audioContext.currentTime);

        gainNode = audioContext.createGain();
        gainNode.gain.setValueAtTime(parseFloat(gainSlider.value), audioContext.currentTime);

        // బ్రౌజర్ ఆడియోను MediaStreamDestination కి పంపి HTML5 ఆడియో ద్వారా ప్లే చేయడం (బ్లూటూత్ మీడియా రూటింగ్ కోసం)
        audioDestinationNode = audioContext.createMediaStreamDestination();

        sourceNode.connect(highPass);
        highPass.connect(voiceClarity);
        voiceClarity.connect(lowPass);
        lowPass.connect(gainNode);
        gainNode.connect(audioDestinationNode);

        audioElement.srcObject = audioDestinationNode.stream;
        await audioElement.play();

        if (audioContext.state === 'suspended') {
          await audioContext.resume();
        }

        await requestWakeLock();
        await populateOutputDevices();

        isRunning = true;
        toggleBtn.innerText = "మైక్ ఆఫ్";
        toggleBtn.classList.add('active');
        statusText.innerText = "లైవ్: సౌండ్ బాక్స్ కి కనెక్ట్ అయింది 🔊";
      } catch (err) {
        console.error("Mic error:", err);
        statusText.innerText = "ఎర్రర్: మైక్ పర్మిషన్ ఇవ్వండి";
      }
    }

    function stopMic() {
      if (mediaStream) {
        mediaStream.getTracks().forEach(track => track.stop());
      }
      if (audioElement) {
        audioElement.srcObject = null;
      }
      if (audioContext && audioContext.state !== 'closed') {
        audioContext.close();
      }
      releaseWakeLock();

      isRunning = false;
      toggleBtn.innerText = "మైక్ ఆన్";
      toggleBtn.classList.remove('active');
      statusText.innerText = "స్టేటస్: మైక్ ఆఫ్ చేయబడింది";
    }

    toggleBtn.addEventListener('click', async () => {
      if (!isRunning) {
        await startMic();
      } else {
        stopMic();
      }
    });
  </script>
</body>
</html>
